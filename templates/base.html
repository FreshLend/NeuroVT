<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141824;
            --bg-tertiary: #1a1f2e;
            --bg-card: #1e2436;
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #60a5fa;
            --accent-hover: #2563eb;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --border-color: #2d3748;
            --input-bg: #0f172a;
            --input-border: #334155;
            --sidebar-width: 260px;
            --sidebar-collapsed: 72px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            overflow-y: auto;
            padding: 0;
            transition: width 0.3s ease;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .sidebar-brand {
            opacity: 0;
            width: 0;
            margin: 0;
        }

        .sidebar-toggle {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .sidebar-toggle:hover {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-primary);
        }

        .sidebar.collapsed .sidebar-toggle {
            margin: 0 auto;
        }

        .sidebar-nav {
            flex: 1;
            padding: 0.75rem;
            overflow-y: auto;
        }

        .sidebar-footer {
            padding: 1rem 0.75rem;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .btn-sidebar {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 10px;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-sidebar i {
            width: 1.75rem;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .btn-sidebar .btn-text {
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .btn-sidebar .btn-text {
            opacity: 0;
            width: 0;
            display: none;
        }

        .sidebar.collapsed .btn-sidebar {
            justify-content: center;
            padding: 0.75rem 0;
            text-align: center;
        }

        .sidebar.collapsed .btn-sidebar i {
            margin: 0;
        }

        .btn-sidebar:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-primary);
        }

        .btn-sidebar:hover i {
            color: var(--accent-primary);
        }

        .btn-sidebar.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-primary);
        }

        .btn-sidebar.active i {
            color: var(--accent-primary);
        }

        .btn-category {
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-category i {
            color: var(--text-muted);
        }

        .btn-sub {
            padding-left: 2.5rem;
            font-size: 0.9rem;
        }

        .sidebar.collapsed .btn-sub {
            padding-left: 0;
        }

        .sidebar-category .collapse {
            margin-left: 0.5rem;
            border-left: 1px solid var(--border-color);
        }

        .btn-category .fa-chevron-down {
            transition: transform 0.3s ease;
            margin-left: auto;
        }

        .btn-category[aria-expanded="true"] .fa-chevron-down {
            transform: rotate(180deg);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem;
            background: var(--bg-primary);
            transition: margin-left 0.3s ease;
        }

        .sidebar.collapsed ~ .main-content {
            margin-left: var(--sidebar-collapsed);
        }

        .module-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .module-content.active {
            display: block;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary) !important;
            font-weight: 600;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-primary);
        }

        .card-header {
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-body p,
        .card-body span:not(.badge):not(.status-indicator),
        .card-body div:not(.alert):not(.chat-message),
        .card-body label,
        .card-body .form-label,
        .card-body small,
        .card-body .text-muted {
            color: var(--text-secondary) !important;
        }

        .card-body .text-primary {
            color: var(--accent-primary) !important;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control, .form-select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary) !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background: var(--input-bg);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: #9ca3af !important;
            opacity: 1;
        }

        .alert {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }

        .alert-warning {
            background: rgba(255, 193, 7, 0.12);
            border-color: rgba(255, 193, 7, 0.3);
            color: #facc15;
        }

        .alert-warning i {
            color: #facc15;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: var(--text-secondary);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn {
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-outline-primary {
            border: 2px solid var(--accent-primary);
            background: transparent;
            color: var(--accent-primary);
        }

        .btn-outline-primary:hover {
            background: var(--accent-primary);
            color: white;
        }

        .nav-tabs {
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .nav-tabs .nav-link {
            border: none;
            color: var(--text-secondary) !important;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tabs .nav-link:hover {
            color: var(--text-primary) !important;
            background: rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
        }

        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white !important;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .chat-log {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .chat-message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent-primary);
        }

        .chat-message.ai {
            background: rgba(96, 165, 250, 0.15);
            border-left: 3px solid var(--accent-secondary);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s infinite;
            margin-right: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .sidebar.collapsed {
                width: 100%;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 1rem;
            }
            .app-container {
                flex-direction: column;
                height: auto;
            }
            .sidebar.collapsed .sidebar-brand {
                opacity: 1;
                width: auto;
                margin: 0;
            }
            .sidebar.collapsed .btn-sidebar .btn-text {
                display: inline;
                opacity: 1;
            }
            .sidebar.collapsed .btn-sidebar {
                justify-content: flex-start;
                padding: 0.75rem 1rem;
            }
            .sidebar.collapsed .btn-sidebar i {
                margin-right: 0.75rem;
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand">
                    <i class="fas fa-robot me-2"></i>
                    NeuroVT
                </a>
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Свернуть/развернуть меню">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                {% block sidebar %}{% endblock %}
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-sidebar" id="settings-btn" onclick="showContent('settings-content')">
                    <i class="fas fa-cog"></i>
                    <span class="btn-text">Настройки</span>
                </button>
            </div>
        </aside>
        <main class="main-content" id="mainContent">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        });

        function showContent(targetId) {
            document.querySelectorAll('.module-content').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(targetId);
            if (target) {
                target.classList.add('active');
            }
            document.querySelectorAll('.btn-sidebar').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.btn-sidebar[data-target="${targetId}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
            if (targetId === 'settings-content') {
                document.getElementById('settings-btn').classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const firstModule = document.querySelector('.module-content:not(#settings-content)');
            if (firstModule) {
                showContent(firstModule.id);
            } else {
                showContent('settings-content');
            }
        });

        document.querySelectorAll('.btn-sidebar:not(.btn-category)').forEach(btn => {
            if (btn.dataset.target) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    showContent(this.dataset.target);
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
