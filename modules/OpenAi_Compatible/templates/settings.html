<div class="row" id="llm-settings-container">
    <div class="col-md-12">
        <div class="alert alert-info mb-3" id="llmStatusAlert">
            <i class="fas fa-info-circle me-2"></i>
            <span id="llmStatusMessage">Загрузка настроек...</span>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">API Настройки</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">API Base URL</label>
                    <input type="text" class="form-control" id="llmApiBaseInput" placeholder="https://openrouter.ai/api/v1">
                    <small class="text-muted">Для OpenAI: https://api.openai.com/v1, для локального: http://localhost:8000/v1</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">API Key</label>
                    <input type="password" class="form-control" id="llmApiKeyInput" placeholder="sk-...">
                </div>
                <div class="mb-3">
                    <button class="btn btn-secondary w-100" onclick="llmFetchModels()" id="llmFetchModelsBtn">
                        <i class="fas fa-download me-2"></i>Загрузить список моделей
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">Модель и параметры</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Поиск модели</label>
                    <input type="text" class="form-control" id="llmModelSearchInput" placeholder="Введите название модели...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Доступные модели</label>
                    <div id="llmModelsList" class="models-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; padding: 5px;">
                        <div class="text-muted text-center p-3">Загрузите список моделей</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Температура: <span id="llmTemperatureValue">0.8</span></label>
                    <input type="range" class="form-range" id="llmTemperatureSlider" min="0" max="2" step="0.1" value="0.8">
                    <div class="d-flex justify-content-between"><small>Точный</small><small>Креативный</small></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Max Tokens (макс. длина ответа)</label>
                    <input type="number" class="form-control" id="llmMaxTokensInput" value="500" min="50" max="2000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Лимит контекста (токенов)</label>
                    <input type="number" class="form-control" id="llmContextLimitInput" value="4096" min="512" max="16384" step="512">
                </div>
                <div class="mb-3">
                    <label class="form-label">System Prompt</label>
                    <textarea class="form-control" id="llmSystemPromptInput" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Префикс для сообщений гостя (виртуальный микрофон)</label>
                    <input type="text" class="form-control" id="llmGuestPrefixInput" value="Сообщение от гостя: ">
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card mb-3">
            <div class="card-header">Fallback ответы (оффлайн режим)</div>
            <div class="card-body">
                <div class="alert alert-warning"><i class="fas fa-exclamation-triangle me-2"></i>Эти ответы используются, когда API недоступен.</div>
                <div class="mb-3">
                    <textarea class="form-control" id="llmFallbackInput" rows="6" style="font-family: monospace;"></textarea>
                    <small class="text-muted">Каждый ответ с новой строки</small>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card">
            <div class="card-body text-center">
                <button class="btn btn-primary btn-lg" onclick="llmSaveAllSettings()"><i class="fas fa-save me-2"></i>Сохранить все настройки</button>
                <button class="btn btn-outline-danger ms-3" onclick="llmResetAllSettings()"><i class="fas fa-undo me-2"></i>Сбросить все настройки</button>
            </div>
        </div>
    </div>
</div>

<style>
    .model-item {
        padding: 10px 12px;
        margin-bottom: 4px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid transparent;
    }
    .model-item:hover {
        background: rgba(99, 102, 241, 0.1);
        border-color: #6366f1;
    }
    .model-item.selected {
        background: rgba(99, 102, 241, 0.2);
        border-color: #6366f1;
        border-left-width: 3px;
    }
    .model-name {
        font-weight: 500;
        color: var(--text-primary);
    }
    .model-id {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: monospace;
        word-break: break-all;
    }
</style>

<script>
    let llmCurrentSettings = {};
    let llmAllModels = {};
    let llmSelectedModelId = null;

    async function llmLoadAllSettings() {
        try {
            const response = await fetch('/api/llm/openai_compatible/get_settings');
            const data = await response.json();
            llmCurrentSettings = data;
            llmAllModels = data.models || {};
            document.getElementById('llmApiBaseInput').value = data.api_base || '';
            document.getElementById('llmApiKeyInput').value = '';
            document.getElementById('llmTemperatureSlider').value = data.temperature;
            document.getElementById('llmTemperatureValue').innerHTML = data.temperature;
            document.getElementById('llmMaxTokensInput').value = data.max_tokens;
            document.getElementById('llmContextLimitInput').value = data.context_token_limit;
            document.getElementById('llmSystemPromptInput').value = data.system_prompt;
            document.getElementById('llmGuestPrefixInput').value = data.guest_prefix || 'Сообщение от гостя: ';
            document.getElementById('llmFallbackInput').value = data.fallback_responses.join('\n');
            llmSelectedModelId = data.model;
            llmRenderModelsList();
            const statusMsg = document.getElementById('llmStatusMessage');
            if (data.has_api_key) {
                statusMsg.innerHTML = '✅ API ключ настроен. Текущая модель: ' + (data.models[data.model] || data.model);
                statusMsg.parentElement.className = 'alert alert-success mb-3';
            } else {
                statusMsg.innerHTML = '⚠️ API ключ не настроен. Будут использоваться fallback ответы.';
                statusMsg.parentElement.className = 'alert alert-warning mb-3';
            }
        } catch(e) { console.error(e); document.getElementById('llmStatusMessage').innerHTML = '❌ Ошибка загрузки настроек'; }
    }

    function isFreeModel(id, name) {
        const text = (id + ' ' + name).toLowerCase();
        return text.includes('free');
    }

    function sortModels(models, selectedId) {
        const entries = Object.entries(models);
        const selected = entries.find(([id]) => id === selectedId);
        const free = entries.filter(([id, name]) => id !== selectedId && isFreeModel(id, name));
        const other = entries.filter(([id, name]) => id !== selectedId && !isFreeModel(id, name));
        free.sort((a, b) => a[1].localeCompare(b[1]));
        other.sort((a, b) => a[1].localeCompare(b[1]));
        const result = [];
        if (selected) result.push(selected);
        result.push(...free);
        result.push(...other);
        return result;
    }

    function llmRenderModelsList() {
        const container = document.getElementById('llmModelsList');
        const searchTerm = document.getElementById('llmModelSearchInput').value.toLowerCase();
        const sorted = sortModels(llmAllModels, llmSelectedModelId);
        let filtered = sorted;
        if (searchTerm) {
            filtered = sorted.filter(([id, name]) => 
                id.toLowerCase().includes(searchTerm) || name.toLowerCase().includes(searchTerm)
            );
        }
        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-muted text-center p-3">Нет моделей, загрузите список</div>';
            return;
        }
        container.innerHTML = filtered.map(([id, name]) => `
            <div class="model-item ${llmSelectedModelId === id ? 'selected' : ''}" data-model-id="${id}" onclick="llmSelectModel('${id}')">
                <div class="model-name">${llmEscapeHtml(name)}</div>
                <div class="model-id">${llmEscapeHtml(id)}</div>
            </div>
        `).join('');
    }

    async function llmSelectModel(modelId) {
        if (!modelId) return;
        try {
            const response = await fetch('/api/llm/openai_compatible/select_model', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model: modelId})
            });
            const data = await response.json();
            if (data.status === 'ok') {
                llmSelectedModelId = modelId;
                llmRenderModelsList();
                llmShowNotification('Модель выбрана: ' + (llmAllModels[modelId] || modelId), 'success');
                if (window.location.pathname === '/') {
                    const modelBadge = document.getElementById('llmCurrentModelBadge');
                    if (modelBadge) modelBadge.innerHTML = '<i class="fas fa-brain me-1"></i>' + (llmAllModels[modelId] || modelId);
                }
            } else {
                llmShowNotification('Ошибка выбора модели: ' + (data.error || ''), 'error');
            }
        } catch(e) {
            llmShowNotification('Ошибка соединения', 'error');
        }
    }

    async function llmFetchModels() {
        const apiBase = document.getElementById('llmApiBaseInput').value;
        const apiKey = document.getElementById('llmApiKeyInput').value;
        if (!apiBase) {
            llmShowNotification('Введите API Base URL', 'error');
            return;
        }
        if (!apiKey) {
            llmShowNotification('Введите API Key', 'error');
            return;
        }
        document.getElementById('llmFetchModelsBtn').disabled = true;
        document.getElementById('llmFetchModelsBtn').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Загрузка...';
        try {
            const response = await fetch('/api/llm/openai_compatible/fetch_models', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            });
            const data = await response.json();
            if (data.status === 'ok') {
                llmAllModels = data.models;
                if (!llmSelectedModelId || !llmAllModels[llmSelectedModelId]) {
                    const firstModel = Object.keys(llmAllModels)[0];
                    if (firstModel) {
                        await llmSelectModel(firstModel);
                    } else {
                        llmSelectedModelId = null;
                    }
                }
                llmRenderModelsList();
                llmShowNotification('Список моделей обновлён', 'success');
            } else {
                llmShowNotification('Ошибка загрузки: ' + (data.error || 'Неизвестная ошибка'), 'error');
            }
        } catch(e) {
            llmShowNotification('Ошибка соединения', 'error');
        } finally {
            document.getElementById('llmFetchModelsBtn').disabled = false;
            document.getElementById('llmFetchModelsBtn').innerHTML = '<i class="fas fa-download me-2"></i>Загрузить список моделей';
        }
    }

    document.getElementById('llmModelSearchInput').addEventListener('input', function() {
        llmRenderModelsList();
    });

    async function llmSaveAllSettings() {
        const apiBase = document.getElementById('llmApiBaseInput').value;
        const apiKey = document.getElementById('llmApiKeyInput').value;
        const model = llmSelectedModelId;
        const temperature = parseFloat(document.getElementById('llmTemperatureSlider').value);
        const maxTokens = parseInt(document.getElementById('llmMaxTokensInput').value);
        const contextLimit = parseInt(document.getElementById('llmContextLimitInput').value);
        const systemPrompt = document.getElementById('llmSystemPromptInput').value;
        const guestPrefix = document.getElementById('llmGuestPrefixInput').value;
        const fallbackText = document.getElementById('llmFallbackInput').value;
        const fallbackResponses = fallbackText.split('\n').filter(l => l.trim().length > 0);
        if (fallbackResponses.length === 0) { llmShowNotification('Добавьте хотя бы один fallback ответ', 'error'); return; }
        const saveData = {
            api_base: apiBase,
            api_key: apiKey,
            model: model,
            temperature: temperature,
            max_tokens: maxTokens,
            context_token_limit: contextLimit,
            system_prompt: systemPrompt,
            fallback_responses: fallbackResponses,
            guest_prefix: guestPrefix
        };
        const response = await fetch('/api/llm/openai_compatible/save_all_settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(saveData)
        });
        const data = await response.json();
        if (data.status === 'ok') {
            llmShowNotification('✅ Все настройки сохранены!', 'success');
            document.getElementById('llmApiKeyInput').value = '';
            await llmLoadAllSettings();
        } else { llmShowNotification('❌ Ошибка сохранения', 'error'); }
    }

    async function llmResetAllSettings() {
        if (!confirm('Сбросить ВСЕ настройки к значениям по умолчанию?')) return;
        const response = await fetch('/api/llm/openai_compatible/reset_settings', {method: 'POST'});
        const data = await response.json();
        if (data.status === 'ok') {
            llmShowNotification('✅ Все настройки сброшены', 'success');
            await llmLoadAllSettings();
            document.getElementById('llmApiBaseInput').value = data.default_api_base;
            document.getElementById('llmTemperatureSlider').value = data.default_temperature;
            document.getElementById('llmTemperatureValue').innerHTML = data.default_temperature;
            document.getElementById('llmMaxTokensInput').value = data.default_max_tokens;
            document.getElementById('llmContextLimitInput').value = data.default_context_limit;
            document.getElementById('llmSystemPromptInput').value = data.default_system_prompt;
            document.getElementById('llmGuestPrefixInput').value = data.default_guest_prefix;
        } else { llmShowNotification('❌ Ошибка сброса', 'error'); }
    }

    document.getElementById('llmTemperatureSlider').addEventListener('input', function() {
        document.getElementById('llmTemperatureValue').innerHTML = this.value;
    });

    function llmEscapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function llmShowNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = `alert alert-${type} position-fixed top-0 end-0 m-3`;
        notification.style.zIndex = '9999';
        notification.style.background = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#3b82f6');
        notification.style.color = '#ffffff';
        notification.innerHTML = message;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
    }

    window.llmSaveAllSettings = llmSaveAllSettings;
    window.llmResetAllSettings = llmResetAllSettings;
    window.llmFetchModels = llmFetchModels;
    window.llmSelectModel = llmSelectModel;
    llmLoadAllSettings();
</script>
