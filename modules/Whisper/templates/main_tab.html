<div class="row">
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">
                <i class="fas fa-microphone me-2"></i>
                Микрофон (основной)
            </div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <span class="badge bg-secondary" id="sttStatusBadge">Загрузка...</span>
                    <span class="badge bg-info ms-2" id="sttModelBadge">-</span>
                </div>
                <div id="sttVoiceText" class="alert alert-info mb-3" style="display: none;">
                    <i class="fas fa-comment-dots me-2"></i>
                    <span id="sttRecognizedText"></span>
                </div>
                <div class="mb-3">
                    <div id="sttSpeakingIndicator" style="display: none;">
                        <i class="fas fa-circle text-danger me-1" style="font-size: 12px;"></i>
                        <span>🎤 Говорите...</span>
                    </div>
                </div>
                <div class="mb-3">
                    <button class="btn btn-primary btn-lg" id="sttToggleBtn" onclick="sttToggle()">
                        <i class="fas fa-microphone me-2"></i>Включить
                    </button>
                    <button class="btn btn-secondary ms-2" onclick="sttRestart()">
                        <i class="fas fa-sync me-2"></i>Перезапустить
                    </button>
                </div>
                <div class="mt-3">
                    <div class="card">
                        <div class="card-header small">История (микрофон)</div>
                        <div class="card-body" id="sttHistoryList" style="max-height: 250px; overflow-y: auto;">
                            <div class="text-muted text-center">Нет записей</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">
                <i class="fas fa-headset me-2"></i>
                Виртуальный микрофон
            </div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <span class="badge bg-secondary" id="sttVirtualStatusBadge">Загрузка...</span>
                </div>
                <div id="sttVirtualVoiceText" class="alert alert-info mb-3" style="display: none;">
                    <i class="fas fa-comment-dots me-2"></i>
                    <span id="sttVirtualRecognizedText"></span>
                </div>
                <div class="mb-3">
                    <div id="sttVirtualSpeakingIndicator" style="display: none;">
                        <i class="fas fa-circle text-danger me-1" style="font-size: 12px;"></i>
                        <span>🎧 Говорите (вирт.)...</span>
                    </div>
                </div>
                <div class="mb-3">
                    <button class="btn btn-primary btn-lg" id="sttVirtualToggleBtn" onclick="sttToggleVirtual()">
                        <i class="fas fa-microphone me-2"></i>Включить вирт.
                    </button>
                    <button class="btn btn-secondary ms-2" onclick="sttRestartVirtual()">
                        <i class="fas fa-sync me-2"></i>Перезапустить
                    </button>
                </div>
                <div class="mt-3">
                    <div class="card">
                        <div class="card-header small">История (виртуальный микрофон)</div>
                        <div class="card-body" id="sttVirtualHistoryList" style="max-height: 250px; overflow-y: auto;">
                            <div class="text-muted text-center">Нет записей</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    let sttStatusInterval = null;
    let sttLastHistoryHash = '';
    let sttLastRecognizedText = '';
    let sttNotificationTimeout = null;
    let sttVirtualLastHistoryHash = '';
    let sttVirtualLastRecognizedText = '';
    let sttVirtualNotificationTimeout = null;

    function sttUpdateHistoryDisplay(history, containerId) {
        const container = document.getElementById(containerId);
        const newHash = JSON.stringify(history);
        const isVirtual = containerId === 'sttVirtualHistoryList';
        if ((isVirtual && newHash === sttVirtualLastHistoryHash) || (!isVirtual && newHash === sttLastHistoryHash)) return;
        if (isVirtual) sttVirtualLastHistoryHash = newHash;
        else sttLastHistoryHash = newHash;
        if (!history || history.length === 0) {
            container.innerHTML = '<div class="text-muted text-center">Нет записей</div>';
            return;
        }
        const scrollPos = container.scrollTop;
        const isScrolledToBottom = container.scrollHeight - container.clientHeight <= scrollPos + 10;
        container.innerHTML = [...history].reverse().map(item => `
            <div class="mb-2 p-2 border rounded">
                <div class="d-flex justify-content-between mb-1">
                    <small class="text-muted">${new Date(item.timestamp).toLocaleTimeString()}</small>
                    <small class="badge bg-secondary">${item.language || 'auto'}</small>
                </div>
                <div class="mt-1">${sttEscapeHtml(item.text)}</div>
            </div>
        `).join('');
        if (isScrolledToBottom) container.scrollTop = container.scrollHeight;
    }

    function sttShowRecognizedText(text, isVirtual) {
        if (isVirtual) {
            if (text === sttVirtualLastRecognizedText) return;
            sttVirtualLastRecognizedText = text;
            const voiceTextDiv = document.getElementById('sttVirtualVoiceText');
            const textSpan = document.getElementById('sttVirtualRecognizedText');
            textSpan.innerHTML = text;
            voiceTextDiv.style.display = 'block';
            if (sttVirtualNotificationTimeout) clearTimeout(sttVirtualNotificationTimeout);
            sttVirtualNotificationTimeout = setTimeout(() => {
                voiceTextDiv.style.display = 'none';
                sttVirtualNotificationTimeout = null;
            }, 3000);
        } else {
            if (text === sttLastRecognizedText) return;
            sttLastRecognizedText = text;
            const voiceTextDiv = document.getElementById('sttVoiceText');
            const textSpan = document.getElementById('sttRecognizedText');
            textSpan.innerHTML = text;
            voiceTextDiv.style.display = 'block';
            if (sttNotificationTimeout) clearTimeout(sttNotificationTimeout);
            sttNotificationTimeout = setTimeout(() => {
                voiceTextDiv.style.display = 'none';
                sttNotificationTimeout = null;
            }, 3000);
        }
    }

    async function sttUpdateStatus() {
        try {
            const response = await fetch("/api/stt/whisper/status");
            const data = await response.json();
            const statusBadge = document.getElementById("sttStatusBadge");
            if (!data.model_loaded) {
                statusBadge.className = "badge bg-danger";
                statusBadge.innerHTML = "❌ Модель не загружена";
            } else if (data.is_listening) {
                if (data.is_speaking) {
                    statusBadge.className = "badge bg-danger";
                    statusBadge.innerHTML = "🎤 Слушаю... (речь)";
                    document.getElementById("sttSpeakingIndicator").style.display = "block";
                } else {
                    statusBadge.className = "badge bg-success";
                    statusBadge.innerHTML = "🎤 Слушаю... (ожидание)";
                    document.getElementById("sttSpeakingIndicator").style.display = "none";
                }
            } else {
                statusBadge.className = "badge bg-secondary";
                statusBadge.innerHTML = "⏹️ Остановлено";
                document.getElementById("sttSpeakingIndicator").style.display = "none";
            }
            document.getElementById("sttModelBadge").innerHTML = data.model_size;
            const toggleBtn = document.getElementById("sttToggleBtn");
            if (data.is_listening) {
                toggleBtn.innerHTML = '<i class="fas fa-stop me-2"></i>Выключить';
                toggleBtn.classList.remove("btn-primary");
                toggleBtn.classList.add("btn-danger");
            } else {
                toggleBtn.innerHTML = '<i class="fas fa-microphone me-2"></i>Включить';
                toggleBtn.classList.remove("btn-danger");
                toggleBtn.classList.add("btn-primary");
            }
            if (data.current_text && data.current_text !== sttLastRecognizedText) sttShowRecognizedText(data.current_text, false);
            sttUpdateHistoryDisplay(data.history, "sttHistoryList");

            const virtualStatusBadge = document.getElementById("sttVirtualStatusBadge");
            if (!data.model_loaded) {
                virtualStatusBadge.className = "badge bg-danger";
                virtualStatusBadge.innerHTML = "❌ Модель не загружена";
            } else if (data.is_listening_virtual) {
                if (data.is_speaking_virtual) {
                    virtualStatusBadge.className = "badge bg-danger";
                    virtualStatusBadge.innerHTML = "🎧 Слушаю... (речь вирт.)";
                    document.getElementById("sttVirtualSpeakingIndicator").style.display = "block";
                } else {
                    virtualStatusBadge.className = "badge bg-success";
                    virtualStatusBadge.innerHTML = "🎧 Слушаю... (ожидание вирт.)";
                    document.getElementById("sttVirtualSpeakingIndicator").style.display = "none";
                }
            } else {
                virtualStatusBadge.className = "badge bg-secondary";
                virtualStatusBadge.innerHTML = "⏹️ Остановлено (вирт.)";
                document.getElementById("sttVirtualSpeakingIndicator").style.display = "none";
            }
            const virtualToggleBtn = document.getElementById("sttVirtualToggleBtn");
            if (data.is_listening_virtual) {
                virtualToggleBtn.innerHTML = '<i class="fas fa-stop me-2"></i>Выключить вирт.';
                virtualToggleBtn.classList.remove("btn-primary");
                virtualToggleBtn.classList.add("btn-danger");
            } else {
                virtualToggleBtn.innerHTML = '<i class="fas fa-microphone me-2"></i>Включить вирт.';
                virtualToggleBtn.classList.remove("btn-danger");
                virtualToggleBtn.classList.add("btn-primary");
            }
            if (data.current_text_virtual && data.current_text_virtual !== sttVirtualLastRecognizedText) sttShowRecognizedText(data.current_text_virtual, true);
            sttUpdateHistoryDisplay(data.history_virtual, "sttVirtualHistoryList");
        } catch(e) {
            console.error("Ошибка статуса STT:", e);
        }
    }

    async function sttToggle() {
        const response = await fetch("/api/stt/whisper/toggle", {method: "POST"});
        const data = await response.json();
        sttShowNotification(data.message, "success");
    }
    async function sttToggleVirtual() {
        const response = await fetch("/api/stt/whisper/toggle_virtual", {method: "POST"});
        const data = await response.json();
        sttShowNotification(data.message, "success");
    }
    async function sttRestart() {
        const response = await fetch("/api/stt/whisper/restart", {method: "POST"});
        const data = await response.json();
        sttShowNotification(data.message, "success");
    }
    async function sttRestartVirtual() {
        const response = await fetch("/api/stt/whisper/restart_virtual", {method: "POST"});
        const data = await response.json();
        sttShowNotification(data.message, "success");
    }
    function sttShowNotification(message, type) {
        const notification = document.createElement("div");
        notification.className = "alert alert-" + type + " position-fixed top-0 end-0 m-3";
        notification.style.zIndex = "9999";
        notification.style.background = type === "success" ? "#10b981" : (type === "error" ? "#ef4444" : "#3b82f6");
        notification.style.color = "#ffffff";
        notification.innerHTML = message;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 2000);
    }
    function sttEscapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    window.sttToggle = sttToggle;
    window.sttToggleVirtual = sttToggleVirtual;
    window.sttRestart = sttRestart;
    window.sttRestartVirtual = sttRestartVirtual;
    sttStatusInterval = setInterval(sttUpdateStatus, 500);
    sttUpdateStatus();
    window.addEventListener("beforeunload", () => {
        if (sttStatusInterval) clearInterval(sttStatusInterval);
        if (sttNotificationTimeout) clearTimeout(sttNotificationTimeout);
        if (sttVirtualNotificationTimeout) clearTimeout(sttVirtualNotificationTimeout);
    });
</script>
